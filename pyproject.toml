[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videosummary"
version = "0.1.0"
description = "Video summary phase-1 pipeline"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper==1.2.1",
  "httpx==0.28.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
